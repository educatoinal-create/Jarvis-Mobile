plugins { id 'com.android.application' }
android {
  namespace 'com.jarvis.v3'
  compileSdk 35
  defaultConfig {
    applicationId 'com.jarvis.v3'
    minSdk 26
    targetSdk 35
    versionCode 3
    versionName '3.0.0-beta'
    testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  }
  flavorDimensions 'edition'
  productFlavors {
    lite { dimension 'edition'; applicationIdSuffix '.lite'; resValue 'string','app_name','JARVIS 3 Lite' }
    full { dimension 'edition'; applicationIdSuffix '.full'; resValue 'string','app_name','JARVIS 3 Full' }
  }
  buildFeatures { buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
  lint { abortOnError true }
}
