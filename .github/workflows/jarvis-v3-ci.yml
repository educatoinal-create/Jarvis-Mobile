name: JARVIS v3 Native Android - Tests and APK
on:
  push:
    branches: [jarvis-v3-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Lite + Full - Source, Lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Offline parser regression test
        run: |
          mkdir -p /tmp/jarvis3-tests
          javac -d /tmp/jarvis3-tests jarvis-v3/app/src/main/java/com/jarvis/v3/Command.java jarvis-v3/app/src/main/java/com/jarvis/v3/CommandParser.java jarvis-v3/tools/ParserSmokeTest.java
          java -cp /tmp/jarvis3-tests com.jarvis.v3.ParserSmokeTest
      - name: XML and flavor privacy checks
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path("jarvis-v3/app/src")
          base=ET.parse(root/"main/AndroidManifest.xml").getroot()
          full=ET.parse(root/"full/AndroidManifest.xml").getroot()
          android="{http://schemas.android.com/apk/res/android}"
          def permissions(doc):
              return {n.attrib.get(android+"name") for n in doc.findall("uses-permission")}
          assert "android.permission.BIND_ACCESSIBILITY_SERVICE" not in permissions(base)
          assert "android.permission.SYSTEM_ALERT_WINDOW" not in permissions(base)
          assert "android.permission.RECORD_AUDIO" in permissions(base)
          assert "android.permission.SYSTEM_ALERT_WINDOW" in permissions(full)
          assert len(full.findall("./application/service"))==3
          ET.parse(root/"main/res/xml/accessibility_config.xml")
          ET.parse(root/"main/res/values/styles.xml")
          print("Manifest and privacy assertions passed.")
          PY
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble both apps
        run: gradle -p jarvis-v3 :app:assembleLiteDebug :app:assembleFullDebug --stacktrace
      - name: Android Lint both apps
        run: gradle -p jarvis-v3 :app:lintLiteDebug :app:lintFullDebug --stacktrace
      - name: Inspect built permissions
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging jarvis-v3/app/build/outputs/apk/lite/debug/app-lite-debug.apk | head -5
          "$AAPT" dump permissions jarvis-v3/app/build/outputs/apk/lite/debug/app-lite-debug.apk > /tmp/lite_permissions.txt
          cat /tmp/lite_permissions.txt
          ! grep -q "SYSTEM_ALERT_WINDOW" /tmp/lite_permissions.txt
          "$AAPT" dump badging jarvis-v3/app/build/outputs/apk/full/debug/app-full-debug.apk | head -5
      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3-Lite-APK
          path: jarvis-v3/app/build/outputs/apk/lite/debug/app-lite-debug.apk
          if-no-files-found: error
      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v3-Full-APK
          path: jarvis-v3/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error
