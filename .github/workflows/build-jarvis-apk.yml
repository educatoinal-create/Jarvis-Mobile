name: Build and test Jarvis Mobile APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Jarvis reviewed source archive
        run: |
          test -f JarvisMobile_Reviewed_Source.zip || { echo "::error::Upload JarvisMobile_Reviewed_Source.zip to the repository root first."; exit 1; }
          unzip -o -q JarvisMobile_Reviewed_Source.zip
          cp overrides/ListenActivity.java app/src/main/java/com/jarvis/mobile/ListenActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(p)
          ET.SubElement(ET.SubElement(tree.getroot().find('queries'),'intent'),'action',{'{'+ns+'}name':'android.speech.action.RECOGNIZE_SPEECH'})
          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY
          test -f app/build.gradle
          sed -i 's/android:windowDimAmount/android:backgroundDimAmount/' app/src/main/res/values/styles.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Java parser smoke tests
        run: |
          mkdir -p /tmp/jarvis-tests
          javac -d /tmp/jarvis-tests app/src/main/java/com/jarvis/mobile/CommandParser.java tools/ParserSmokeTest.java
          java -cp /tmp/jarvis-tests com.jarvis.mobile.ParserSmokeTest
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-Full-V2-Voice-Fix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
