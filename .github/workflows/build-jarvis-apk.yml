name: Build and test Jarvis Mobile APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Jarvis reviewed source archive
        run: |
          test -f JarvisMobile_Reviewed_Source.zip || { echo "::error::Upload JarvisMobile_Reviewed_Source.zip to the repository root first."; exit 1; }
          unzip -o -q JarvisMobile_Reviewed_Source.zip
          test -f app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Java parser smoke tests
        run: |
          mkdir -p /tmp/jarvis-tests
          javac -d /tmp/jarvis-tests app/src/main/java/com/jarvis/mobile/CommandParser.java tools/ParserSmokeTest.java
          java -cp /tmp/jarvis-tests ParserSmokeTest
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
