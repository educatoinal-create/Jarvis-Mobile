name: Build Jarvis Lite APK (reduced permissions)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and make Lite edition
        run: |
          unzip -o -q JarvisMobile_Reviewed_Source.zip
          sed -i 's/android:windowDimAmount/android:backgroundDimAmount/' app/src/main/res/values/styles.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          manifest = Path("app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          sensitive = {".JarvisAccessibilityService", ".NotificationReaderService"}
          removed = []
          for service in list(app.findall("service")):
              name = service.attrib.get("{" + ns + "}name")
              if name in sensitive:
                  app.remove(service)
                  removed.append(name)
          assert set(removed) == sensitive, removed
          app.set("{" + ns + "}label", "Jarvis Mobile Lite")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          gradle = Path("app/build.gradle")
          s = gradle.read_text()
          assert "applicationId 'com.jarvis.mobile'" in s
          gradle.write_text(s.replace("applicationId 'com.jarvis.mobile'", "applicationId 'com.jarvis.mobile.lite'"))
          ui = Path("app/src/main/java/com/jarvis/mobile/MainActivity.java")
          s = ui.read_text()
          start = s.index('        button(permissionCard,"2. ENABLE SCREEN CONTROL"')
          end = s.index('        });', start) + len('        });')
          s = s[:start] + s[end:]
          bad = '        button(permissionCard,"4. NOTIFICATION ACCESS (OPTIONAL)",PURPLE,()->startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")));'
          assert bad in s
          s = s.replace(bad, '')
          s = s.replace('Mobile AI Assistant  •  v1.0', 'Mobile AI Assistant  •  LITE v1.0')
          s = s.replace('Screen Control can read visible UI only to carry out your requested command.', 'Lite does not include screen control or notification reading.')
          s = s.replace('Accessibility grants strong control: enable only if you trust this app. Android may restrict controls on secure screens.', 'Lite does not request Accessibility or Notification Listener access.')
          ui.write_text(s)
          eng = Path("app/src/main/java/com/jarvis/mobile/CommandEngine.java")
          s = eng.read_text().replace('Turn on Jarvis Screen Control in Android Accessibility settings first.', 'This needs Accessibility, which is not included in Jarvis Lite.')
          s = s.replace('Enable Notification access from the Jarvis setup screen first.', 'Reading notifications is not available in Jarvis Lite.')
          eng.write_text(s)
          check = ET.parse(manifest)
          labels = [x.attrib.get("{" + ns + "}name","") for x in check.iter("service")]
          assert not any("Accessibility" in x or "NotificationReader" in x for x in labels), labels
          print("Lite manifest verified without sensitive services")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Parser regression tests
        run: |
          mkdir -p /tmp/jarvis-tests
          javac -d /tmp/jarvis-tests app/src/main/java/com/jarvis/mobile/CommandParser.java tools/ParserSmokeTest.java
          java -cp /tmp/jarvis-tests com.jarvis.mobile.ParserSmokeTest
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile JARVIS Lite debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload JARVIS Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
