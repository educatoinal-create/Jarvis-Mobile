name: JARVIS v3 Android emulator smoke tests
on:
  push:
    branches: [jarvis-v3-rebuild]
    paths:
      - 'jarvis-v3/**'
      - '.github/workflows/jarvis-v3-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APKs
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p jarvis-v3 :app:assembleLiteDebug :app:assembleFullDebug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch both editions on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r jarvis-v3/app/build/outputs/apk/lite/debug/app-lite-debug.apk
            adb shell am start -n com.jarvis.v3.lite/com.jarvis.v3.MainActivity
            sleep 4
            adb shell pm list packages | grep 'com.jarvis.v3.lite'
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep 'JARVIS 3'
            adb shell am force-stop com.jarvis.v3.lite
            adb install -r jarvis-v3/app/build/outputs/apk/full/debug/app-full-debug.apk
            adb shell am start -n com.jarvis.v3.full/com.jarvis.v3.MainActivity
            sleep 4
            adb shell pm list packages | grep 'com.jarvis.v3.full'
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep 'JARVIS 3'
            adb logcat -d -v brief | grep -E 'FATAL EXCEPTION' && exit 1 || true
            echo 'Both editions installed and UI launched on emulator.'
